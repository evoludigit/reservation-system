name: Quality Gate

# Comprehensive quality checks for all PR and main branch protection
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_reservation_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_reservation_db
      DJANGO_SETTINGS_MODULE: reservation_system.settings
      SECRET_KEY: test-secret-key-for-ci-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup environment and install dependencies
        run: |
          # Create virtual environment with uv
          uv venv

          # Install all dependencies including dev dependencies
          uv sync --extra dev

      - name: Enable PostgreSQL btree_gist extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_reservation_db -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Verify Environment
        run: |
          echo "=== Environment Verification ==="
          uv run python --version
          uv --version
          uv run pytest --version
          uv run python manage.py --version

      - name: Run Django checks
        run: |
          echo "=== Django System Check ==="
          uv run python manage.py check

      - name: Run migrations
        run: |
          echo "=== Running Migrations ==="
          uv run python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          echo "=== Running Test Suite ==="
          uv run pytest --tb=short --cov=bookings --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          uv sync --extra dev

      - name: Run mypy type checking
        run: uv run mypy bookings/ || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          uv pip install bandit[toml]

      - name: Run bandit security scan
        run: uv run bandit -r bookings/ -f json || true

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [test, lint, type-check, security]
    if: always()
    steps:
      - name: Check quality gate status
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Quality gate failed!"
            exit 1
          fi
          echo "✅ All quality checks passed!"
